apiVersion: batch/v1
kind: Job
metadata:
  name: job-kafka-topic-retention
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: job-kafka-topic-retention
    spec:
      restartPolicy: OnFailure
      containers:
        - name: job-kafka-topic-retention
          image: bitnamilegacy/kafka:3.5.1-debian-11-r3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          command:
            - bash
            - -ec
            - |
              BOOTSTRAP=kafka-service.kafka.svc:9092
              CONFIG=retention.ms=604800000,retention.bytes=1000000000,segment.ms=86400000,segment.bytes=100000000
              TOPICS=$(/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list | grep -v '^__' || true)
              for TOPIC in $TOPICS; do
                echo "applying retention to $TOPIC"
                /opt/bitnami/kafka/bin/kafka-configs.sh --bootstrap-server "$BOOTSTRAP" \
                  --alter --entity-type topics --entity-name "$TOPIC" \
                  --add-config "$CONFIG"
              done
