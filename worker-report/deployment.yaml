apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-report
  namespace: bd-prd
spec:
  selector:
    matchLabels:
      app: worker-report
  replicas: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: worker-report
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - mysql
                topologyKey: kubernetes.io/hostname
      containers:
        - name: worker-report
          image: quay.io/bot_detector/report-worker:f1453a3
          resources:
            requests:
              cpu: 100m
              memory: 150Mi
          env:
            # components/bot_detector/event_queue/adapters/kafka/settings.py
            - name: bootstrap_servers
              value: kafka-service.kafka.svc:9092
            # components/bot_detector/database/core.py
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: report-worker
                  key: DATABASE_URL
            - name: POOL_TIMEOUT
              value: '25'
            - name: POOL_RECYCLE
              value: '25'
            - name: DB_DEBUG
              value: '0'
            # bases/bot_detector/worker_report/settings.py
            - name: MAX_INTERVAL_MS
              value: "30000"
            - name: MAX_BATCH_SIZE
              value: "10000"
