apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-backfill-banned
  namespace: bd-prd
spec:
  # one-shot backfill completed 2026-07-31; kept for the env/secret contract,
  # suspended so argocd sync stays green (a Job cannot be replaced in place:
  # spec.selector is immutable, Replace=true retried forever)
  suspend: true
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: job-backfill-banned
        spec:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                            - mysql
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: job-backfill-banned
              image: quay.io/bot_detector/job_backfill_banned:21ef9ca
              resources:
                requests:
                  cpu: 100m
                  memory: 150Mi
              env:
                - name: bootstrap_servers
                  value: kafka-service.kafka.svc:9092
                - name: POOL_TIMEOUT
                  value: '25'
                - name: POOL_RECYCLE
                  value: '25'
                - name: ENV
                  value: PRD
                - name: BATCH_SIZE
                  value: '10000'
                - name: MAX_LAG
                  value: '100000'
                - name: LAG_SLEEP_SECONDS
                  value: '10'
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: job-backfill-banned
                      key: DATABASE_URL
          restartPolicy: OnFailure
