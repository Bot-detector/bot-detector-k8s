apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-highscore
  namespace: bd-prd
spec:
  selector:
    matchLabels:
      app: scraper-highscore
  replicas: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: scraper-highscore
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - mysql
                topologyKey: kubernetes.io/hostname
      containers:
        - name: scraper-highscore
          image: quay.io/bot_detector/scraper-highscore:21ef9ca
          resources:
            requests:
              cpu: 200m
              memory: 150Mi
          ports:
            - name: metrics
              containerPort: 8000
          env:
            - name: PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  key: PROXY_API_KEY
                  name: bd-prd-scraper-secret
            - name: bootstrap_servers
              value: kafka-service.kafka.svc:9092
            - name: SESSION_TIMEOUT
              value: '60'
            - name: FETCH_CONCURRENCY
              value: '600'
            - name: PROCESS_CONCURRENCY
              value: '16'
            - name: CONSUME_BATCH_SIZE
              value: '200'
            - name: TASK_QUEUE_MAXSIZE
              value: '2000'
            - name: RESULTS_QUEUE_MAXSIZE
              value: '2000'
            - name: CONNECTION_LIMIT
              value: '3600'
