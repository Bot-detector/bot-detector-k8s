apiVersion: v1
kind: ServiceAccount
metadata:
  name: restart-scrapers
  namespace: bd-prd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restart-scrapers
  namespace: bd-prd
rules:
  # mutating access, restricted to the two scraper deployments
  - apiGroups: ['apps']
    resources: ['deployments']
    resourceNames: ['scraper-highscore', 'scraper-runemetrics']
    verbs: ['get', 'patch']
  # `kubectl rollout status` watches deployments by label selector (a collection
  # request), which RBAC cannot scope with resourceNames; read-only
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restart-scrapers
  namespace: bd-prd
subjects:
  - kind: ServiceAccount
    name: restart-scrapers
    namespace: bd-prd
roleRef:
  kind: Role
  name: restart-scrapers
  apiGroup: rbac.authorization.k8s.io
