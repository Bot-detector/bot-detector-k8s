apiVersion: batch/v1
kind: CronJob
metadata:
  name: tipoff
  namespace: bd-prd
  labels:
    app.kubernetes.io/name: automation
    app.kubernetes.io/instance: tipoff
spec:
  schedule: 0 10 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: automation
            app.kubernetes.io/instance: tipoff
        spec:
          restartPolicy: OnFailure
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: automation
                        app.kubernetes.io/instance: tipoff
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: bd-prd-automation
              image: quay.io/bot_detector/bd-automation:d803414
              command:
                - python
                - src/main.py
              args:
                - '--run-tipoff'
              env:
                - name: EMAIL_FROM
                  valueFrom:
                    secretKeyRef:
                      key: EMAIL_FROM
                      name: bd-prd-automation-secret
                - name: EMAIL_TIPOFF
                  valueFrom:
                    secretKeyRef:
                      key: EMAIL_TIPOFF
                      name: bd-prd-automation-secret
                - name: SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: SMTP_PASSWORD
                      name: bd-prd-automation-secret
                - name: SMTP_PORT
                  valueFrom:
                    secretKeyRef:
                      key: SMTP_PORT
                      name: bd-prd-automation-secret
                - name: SMTP_SERVER
                  valueFrom:
                    secretKeyRef:
                      key: SMTP_SERVER
                      name: bd-prd-automation-secret
                - name: JMOD_TAG
                  valueFrom:
                    secretKeyRef:
                      key: JMOD_TAG
                      name: bd-prd-automation-secret
                - name: SERVER_LOGIN
                  valueFrom:
                    secretKeyRef:
                      key: SERVER_LOGIN
                      name: bd-prd-automation-secret
                - name: SERVER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: SERVER_PASSWORD
                      name: bd-prd-automation-secret
                - name: DATABASE
                  valueFrom:
                    secretKeyRef:
                      key: DATABASE
                      name: bd-prd-automation-secret
                - name: SERVER_ADDRESS
                  value: mysql.database.svc
                - name: GRAVEYARD_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      key: GRAVEYARD_WEBHOOK
                      name: bd-prd-automation-secret
                - name: CONSUMER_KEY
                  valueFrom:
                    secretKeyRef:
                      key: CONSUMER_KEY
                      name: bd-prd-automation-secret
                - name: CONSUMER_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: CONSUMER_SECRET
                      name: bd-prd-automation-secret
                - name: BEARER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: BEARER_TOKEN
                      name: bd-prd-automation-secret
                - name: ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_TOKEN
                      name: bd-prd-automation-secret
                - name: ACCESS_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: ACCESS_TOKEN_SECRET
                      name: bd-prd-automation-secret
                - name: PATRON_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      key: PATRON_WEBHOOK
                      name: bd-prd-automation-secret
                - name: KAFKA_HOST
                  value: kafka-service.kafka.svc:9092
                - name: ENDPOINT
                  value: http://private-api-svc.bd-prd.svc:5000
                - name: API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: API_TOKEN
                      name: bd-prd-automation-secret
                - name: BATCH_SIZE
                  value: '10000'
                - name: SERVER_PORT
                  value: '3306'
