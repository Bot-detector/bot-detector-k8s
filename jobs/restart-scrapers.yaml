apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-restart-scrapers
  namespace: bd-prd
spec:
  schedule: "0 23 * * *"
  timeZone: UTC
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: job-restart-scrapers
        spec:
          serviceAccountName: restart-scrapers
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.33.2
              resources:
                requests:
                  cpu: 100m
                  memory: 150Mi
              command:
                - /bin/sh
                - -c
                - kubectl -n bd-prd rollout restart deployment/scraper-highscore deployment/scraper-runemetrics
