apiVersion: apps/v1
kind: Deployment
metadata:
  name: bd-prd-discord
  namespace: bd-prd
spec:
  selector:
    matchLabels:
      app: bd-prd-discord
  replicas: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: bd-prd-discord
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - mysql
                topologyKey: kubernetes.io/hostname
      containers:
        - name: bd-prd-discord
          image: quay.io/bot_detector/bd-discord-bot:3cf8485
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bd-prd-discord-secret
                  key: TOKEN
            - name: COMMAND_PREFIX
              valueFrom:
                secretKeyRef:
                  name: bd-prd-discord-secret
                  key: COMMAND_PREFIX
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bd-prd-discord-secret
                  key: API_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bd-prd-discord-secret
                  key: SQL_URI
            - name: API_URL
              valueFrom:
                secretKeyRef:
                  name: bd-prd-discord-secret
                  key: API_URL
            - name: WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: bd-prd-discord-secret
                  key: WEBHOOK
            - name: OSRS_ITEMS_USER_AGENT
              value: https://discord.gg/JCAGpcjbfP
            - name: SYNC_GUILD_ID
              value: '817916789668708384'
            - name: DEBUG
              value: 'true'
