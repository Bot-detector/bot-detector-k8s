apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrape-task-producer
  namespace: bd-prd
spec:
  selector:
    matchLabels:
      app: scrape-task-producer
  replicas: 1
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: scrape-task-producer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - mysql
                topologyKey: kubernetes.io/hostname
      containers:
        - name: scrape-task-producer
          image: quay.io/bot_detector/scrape_task_producer:7099fbc
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 1
          env:
            - name: bootstrap_servers
              value: kafka-service.kafka.svc:9092
            - name: POOL_TIMEOUT
              value: '25'
            - name: POOL_RECYCLE
              value: '25'
            - name: LIMIT
              value: '10000'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: highscore-worker
                  key: DATABASE_URL
