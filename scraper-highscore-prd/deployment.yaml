apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-highscore
  namespace: bd-prd
spec:
  selector:
    matchLabels:
      app: scraper-highscore
  replicas: 2
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: scraper-highscore
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - mysql
                topologyKey: kubernetes.io/hostname
      containers:
        - name: scraper-highscore
          image: quay.io/bot_detector/scraper-highscore:4d05888
          resources:
            requests:
              cpu: 200m
              memory: 150Mi
          ports:
            - name: metrics
              containerPort: 8000
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # daily restart: kill the container at the next 23:00 UTC
                    now=$(date +%s)
                    target=$(date -d "23:00" +%s)
                    if [ "$target" -le "$now" ]; then
                      target=$(date -d "tomorrow 23:00" +%s)
                    fi
                    sleep $((target - now))
                    kill -TERM 1
          env:
            - name: PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  key: PROXY_API_KEY
                  name: bd-prd-scraper-secret
            - name: bootstrap_servers
              value: kafka-service.kafka.svc:9092
            - name: SESSION_TIMEOUT
              value: '60'
